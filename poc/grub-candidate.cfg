set pager=0
echo AP_RUN_EXACT_GRUB_DC505A15
echo AP_GDBINFO_BEGIN
gdbinfo
echo AP_GDBINFO_END
echo AP_LOCKDOWN_BEFORE=$lockdown
echo AP_PRE_LOAD_EXPECT_REJECT
insmod /ap-marker.mod
echo AP_PRE_LOAD_DONE
echo AP_SERIAL_CONFIG_ONLY_BEGIN
serial --port=mmio,1c7931d8.q --speed=450 --word=8 --parity=no --stop=1 --rtscts=off
echo AP_SERIAL_CONFIG_ONLY_DONE
echo AP_CONFIG_ONLY_LOAD_EXPECT_REJECT
insmod /ap-marker.mod
echo AP_CONFIG_ONLY_LOAD_DONE
echo AP_CONFIG_ONLY_HOLD_30S
sleep 30
echo AP_TRIGGER_INPUT_ONLY_BEGIN
terminal_input --append serial
sleep --interruptible 1
echo AP_TRIGGER_INPUT_ONLY_DONE
echo AP_LOCKDOWN_AFTER=$lockdown
echo AP_POST_LOAD_BEGIN
insmod /ap-marker.mod
echo AP_POST_LOAD_DONE
echo AP_CALL_HELLO_BEGIN
hello
echo AP_CALL_HELLO_DONE
echo AP_FINAL_HOLD
sleep 600
